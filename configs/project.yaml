project:
  name: concept_drift_swat
  seed: 42
  results_dir: results

data:
  archive_dir: archive
  primary_file: merged.csv
  timestamp_col: Timestamp
  label_col: Normal/Attack
  timestamp_format: "%d/%m/%Y %I:%M:%S %p"
  label_map:
    Normal: 0
    Attack: 1
  # Verified: all Normal rows precede Attack rows in merged.csv
  reference_drift_indices:
    - name: normal_to_attack_label_boundary
      stream_index: 1387098
      description: First Attack label after contiguous Normal segment (verified by scan)
  initial_train_size: 5000
  warmup_min_labeled: 5000

stream:
  replay_rate_hz: 0
  batch_size: 1
  # Smoke window spans verified Normal→Attack boundary (index 1387098) + post-attack samples
  smoke_start_index: 1385000
  smoke_max_events: 25000
  full_max_events: null

kafka:
  bootstrap_servers: localhost:9092
  topic: swat-events
  enabled: true

influx:
  url: http://localhost:8086
  org: swat
  bucket: metrics
  token: swat-dev-token
  enabled: true

spark:
  enabled: false
  master: local[*]
  checkpoint_dir: results/spark-checkpoints
